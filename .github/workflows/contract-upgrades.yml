name: Contract upgrade safety

on:
  pull_request:
    paths:
      - "contracts/**"
      - "docs/contract-upgrades.md"
      - ".github/workflows/contract-upgrades.yml"
  push:
    branches: [main, develop]
    paths:
      - "contracts/**"
      - "docs/contract-upgrades.md"
      - ".github/workflows/contract-upgrades.yml"

jobs:
  realistic-storage-upgrades:
    name: Realistic storage upgrade tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and Soroban Wasm target
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none

      - name: Build production, manager, candidate, and legacy Wasm
        working-directory: contracts
        run: >-
          cargo build --workspace --target wasm32v1-none --release

      - name: Run the complete upgrade test suite
        working-directory: contracts
        run: >-
          cargo test -p upgrade --features testutils
