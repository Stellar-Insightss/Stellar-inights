[package]
name = "stellar-insights-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = "0.13"
log = "0.4"
env_logger = "0.10"
thiserror = "1"
lazy_static = "1.4"